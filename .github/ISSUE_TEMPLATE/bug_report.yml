name: Bug report
description: Something broke or behaved unexpectedly.
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check existing issues to see if it's already known.
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: A release tag, commit SHA, or "main @ YYYY-MM-DD".
      placeholder: v0.1.0 or main @ 2026-05-25
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: What did you do, what did you expect, what happened instead? Be specific.
      placeholder: |
        1. Start the game in Resonance mode on Architect difficulty
        2. Place two prisms in a row aimed at the source beacon
        3. Expected: beam routes through both
        4. Actual: beam stops at the first prism
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Godot version (should be 4.6 .NET), .NET SDK version, GPU if it might matter.
      placeholder: |
        OS: Windows 11
        Godot: 4.6.stable.mono
        .NET SDK: 8.0.x
        GPU: RTX 3070
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste console output, stack traces, or attach screenshots.
    validations:
      required: false
