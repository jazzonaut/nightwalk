name: Release (Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, no v prefix (e.g. 0.1.0 or 0.1.0-rc1)'
        required: true
        type: string
      draft:
        description: 'Create release as draft'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & release Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version input
        shell: pwsh
        run: |
          if ('${{ inputs.version }}' -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.\-]+)?$') {
            Write-Error "Version must look like 0.1.0 or 0.1.0-rc1"
            exit 1
          }

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Godot 4.6.3 (.NET)
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.3
          use-dotnet: true
          include-templates: true

      - name: Inject version into export_presets.cfg
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'
          $content = Get-Content export_presets.cfg
          $content = $content -replace 'application/file_version="[^"]*"', "application/file_version=`"$v`""
          $content = $content -replace 'application/product_version="[^"]*"', "application/product_version=`"$v`""
          $content | Set-Content export_presets.cfg

      - name: Install rcedit
        shell: pwsh
        run: |
          # rcedit patches the exported .exe's Windows resources (icon, version,
          # company name, etc). Godot invokes it when application/modify_resources
          # is true and the editor setting export/windows/rcedit points at it.
          $tools = Join-Path $env:GITHUB_WORKSPACE 'tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $rcedit = Join-Path $tools 'rcedit-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe' -OutFile $rcedit
          if (-not (Test-Path $rcedit)) {
            Write-Error "rcedit download failed"
            exit 1
          }
          "RCEDIT_PATH=$rcedit" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Point Godot editor settings at rcedit
        shell: pwsh
        run: |
          # Godot reads export/windows/rcedit from editor_settings-4.tres. Write
          # a minimal file with just that key; Godot fills in defaults for the
          # rest on first load. (godot --headless --quit does not generate this
          # file because it doesn't run as the editor.)
          $settingsDir = Join-Path $env:APPDATA 'Godot'
          New-Item -ItemType Directory -Force -Path $settingsDir | Out-Null
          $settingsFile = Join-Path $settingsDir 'editor_settings-4.tres'
          $rceditForward = $env:RCEDIT_PATH -replace '\\', '/'
          $lines = @(
            '[gd_resource type="EditorSettings" format=3]',
            '',
            '[resource]',
            "export/windows/rcedit = `"$rceditForward`""
          )
          Set-Content -Path $settingsFile -Value $lines -Encoding utf8
          Write-Host "Wrote $settingsFile"
          Get-Content $settingsFile

      - name: Restore .NET dependencies
        run: dotnet restore Nightwalk.csproj

      - name: Build C# project (ExportRelease)
        run: dotnet build Nightwalk.csproj -c ExportRelease --no-restore

      - name: Generate Godot C# bindings
        shell: pwsh
        run: |
          # Required for .NET projects between `dotnet build` and
          # `godot --export-release`. Without this, the export step reports
          # "Failed to load project assembly" (godotengine/godot#92267).
          $ErrorActionPreference = 'Continue'
          godot --headless --build-solutions --quit

      - name: Godot headless import pass
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          godot --headless --import
          if (-not (Test-Path .godot)) {
            Write-Error ".godot/ cache directory was not produced"
            exit 1
          }

      - name: Export Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null

          # chickensoft-games/setup-godot exposes 'godot' as an extension-less
          # hardlink. PowerShell silently drops invocations of it when an arg
          # with a space ("Windows Desktop") is passed. Create a .exe sibling
          # next to the alias so GodotSharp/ stays resolvable and PS treats
          # it as a normal executable.
          $godotAlias = (Get-Command godot).Source
          $godotExe = "$godotAlias.exe"
          if (-not (Test-Path $godotExe)) {
            $null = New-Item -ItemType HardLink -Path $godotExe -Value $godotAlias -ErrorAction SilentlyContinue
            if (-not (Test-Path $godotExe)) {
              Copy-Item -Path $godotAlias -Destination $godotExe -Force
            }
          }

          # Capture combined stdout+stderr so we can see why Godot bailed if
          # the .exe is missing afterwards (banner-only output gives us nothing).
          $ErrorActionPreference = 'Continue'
          & $godotExe --headless --export-release "Windows Desktop" bin/Nightwalk.exe 2>&1 | Tee-Object -FilePath export.log
          $exportExit = $LASTEXITCODE

          if (-not (Test-Path bin/Nightwalk.exe)) {
            Write-Host "::group::godot export diagnostics"
            Write-Host "godot exit code: $exportExit"
            Write-Host "--- export.log ---"
            if (Test-Path export.log) { Get-Content export.log } else { Write-Host "(no export.log produced)" }
            Write-Host "--- bin/ contents ---"
            if (Test-Path bin) { Get-ChildItem bin -Recurse | Format-Table -AutoSize | Out-String } else { Write-Host "(bin/ missing)" }
            $templatesRoot = Join-Path $env:APPDATA 'Godot\export_templates'
            Write-Host "--- export_templates ($templatesRoot) ---"
            if (Test-Path $templatesRoot) { Get-ChildItem $templatesRoot -Recurse -Depth 1 | Format-Table -AutoSize | Out-String } else { Write-Host "(no templates dir)" }
            Write-Host "::endgroup::"
            Write-Error "Export produced no exe"
            exit 1
          }

      - name: Stage release contents
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'
          $stage = "stage/Nightwalk-$v-windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item bin/* -Destination $stage -Recurse
          Copy-Item LICENSE, README.md -Destination $stage
          Compress-Archive -Path $stage -DestinationPath "Nightwalk-$v-windows.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightwalk-windows-${{ inputs.version }}
          path: Nightwalk-${{ inputs.version }}-windows.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Nightwalk v${{ inputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: Nightwalk-${{ inputs.version }}-windows.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
