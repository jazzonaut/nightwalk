name: Release (Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, no v prefix (e.g. 0.1.0 or 0.1.0-rc1)'
        required: true
        type: string
      draft:
        description: 'Create release as draft'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & release Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version input
        shell: pwsh
        run: |
          if ('${{ inputs.version }}' -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.\-]+)?$') {
            Write-Error "Version must look like 0.1.0 or 0.1.0-rc1"
            exit 1
          }

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Godot 4.6.3 (.NET)
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.3
          use-dotnet: true
          include-templates: true

      - name: Inject version into export_presets.cfg
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'
          $content = Get-Content export_presets.cfg
          $content = $content -replace 'application/file_version="[^"]*"', "application/file_version=`"$v`""
          $content = $content -replace 'application/product_version="[^"]*"', "application/product_version=`"$v`""
          $content | Set-Content export_presets.cfg
          Write-Host "Updated export_presets.cfg with version $v"

      - name: Toolchain diagnostics
        shell: pwsh
        run: |
          Write-Host "Working directory: $(Get-Location)"
          $godot = Get-Command godot -ErrorAction SilentlyContinue
          if ($godot) { Write-Host "godot resolves to: $($godot.Source)" } else { Write-Host "godot NOT FOUND ON PATH" }
          $dotnet = Get-Command dotnet -ErrorAction SilentlyContinue
          if ($dotnet) { Write-Host "dotnet resolves to: $($dotnet.Source)" } else { Write-Host "dotnet NOT FOUND ON PATH" }
          Write-Host "godot --version:"
          godot --version
          Write-Host "dotnet --version:"
          dotnet --version
          Write-Host "Project root:"
          Get-ChildItem -Force | Select-Object Mode, Name

      - name: Restore .NET dependencies
        run: dotnet restore Nightwalk.csproj

      - name: Godot headless import pass
        shell: pwsh
        run: |
          # Import first so .godot/ exists before any C# build — Godot.NET.Sdk
          # uses .godot/ to compute the assembly output path.
          $ErrorActionPreference = 'Continue'
          godot --headless --import
          Write-Host "Import exit code: $LASTEXITCODE"
          if (-not (Test-Path .godot)) {
            Write-Error ".godot/ cache directory was not produced"
            exit 1
          }

      - name: Build C# project (ExportRelease)
        shell: pwsh
        run: |
          dotnet build Nightwalk.csproj -c ExportRelease --no-restore
          Write-Host "===== Searching for Nightwalk.dll ====="
          Get-ChildItem -Path . -Filter "Nightwalk.dll" -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime | Format-Table | Out-Host

      - name: Export Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path bin | Out-Null

          Write-Host "===== Pre-export sanity ====="
          Write-Host "PWD: $(Get-Location)"
          Write-Host "project.godot present: $(Test-Path project.godot)"
          $resolved = (Get-Command godot -ErrorAction SilentlyContinue).Source
          Write-Host "godot resolves to: $resolved"

          Write-Host "===== Export templates check ====="
          $templatesRoot = "$env:APPDATA\Godot\export_templates"
          if (Test-Path $templatesRoot) {
            Get-ChildItem $templatesRoot -Recurse -Depth 1 | Format-Table Mode, Name | Out-Host
          } else {
            Write-Host "(no $templatesRoot directory)"
          }

          Write-Host "===== Built assemblies search ====="
          $dlls = Get-ChildItem -Path . -Filter "Nightwalk.dll" -Recurse -ErrorAction SilentlyContinue
          if ($dlls) {
            $dlls | Select-Object FullName, Length, LastWriteTime | Format-Table | Out-Host
          } else {
            Write-Host "NO Nightwalk.dll found anywhere in workspace — build step did not produce an assembly"
          }
          Write-Host ".godot/ tree (depth 3):"
          if (Test-Path .godot) {
            Get-ChildItem .godot -Recurse -Depth 3 -Force -ErrorAction SilentlyContinue |
              Where-Object { -not $_.PSIsContainer -or $_.FullName.Split([IO.Path]::DirectorySeparatorChar).Count -lt 6 } |
              Format-Table Mode, Length, Name | Out-Host
          } else {
            Write-Host "(no .godot/ directory)"
          }

          # The chickensoft-games/setup-godot action exposes 'godot' as an
          # extension-less hardlink. PowerShell silently drops invocations
          # of that alias when a space-containing arg is involved. Create
          # an .exe sibling next to the alias (same directory) so godot
          # still finds GodotSharp/ relative to its own location, while
          # giving PowerShell a sane extension to invoke.
          Write-Host "===== Preparing godot.exe ====="
          $godotAlias = (Get-Command godot -ErrorAction SilentlyContinue).Source
          if (-not $godotAlias -or -not (Test-Path $godotAlias)) {
            Write-Error "Cannot resolve godot from PATH"
            exit 1
          }
          Write-Host "Alias source: $godotAlias"
          $godotExe = "$godotAlias.exe"
          if (-not (Test-Path $godotExe)) {
            # Same-volume hardlink: instant, zero copy
            $null = New-Item -ItemType HardLink -Path $godotExe -Value $godotAlias -ErrorAction SilentlyContinue
            if (-not (Test-Path $godotExe)) {
              # Hardlink can fail if filesystem doesn't support it; fall back to copy
              Copy-Item -Path $godotAlias -Destination $godotExe -Force
            }
          }
          Write-Host "godot.exe: $godotExe"
          $sharpDir = Join-Path (Split-Path $godotAlias -Parent) "GodotSharp"
          Write-Host "GodotSharp dir: $sharpDir (exists: $(Test-Path $sharpDir))"

          Write-Host "===== Running godot export ====="
          & $godotExe --headless --verbose --export-release "Windows Desktop" bin/Nightwalk.exe
          $exitCode = $LASTEXITCODE
          Write-Host "===== Export exit code: $exitCode ====="

          Write-Host "===== bin/ contents after export ====="
          if (Test-Path bin) {
            Get-ChildItem bin -Recurse | Format-Table Mode, Length, Name | Out-Host
          } else {
            Write-Host "(bin/ does not exist)"
          }

          if (-not (Test-Path bin/Nightwalk.exe)) {
            Write-Error "Export produced no exe — see godot output above"
            exit 1
          }

      - name: Stage release contents
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'
          $stage = "stage/Nightwalk-$v-windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item bin/* -Destination $stage -Recurse
          Copy-Item LICENSE, CREDITS.md, README.md -Destination $stage
          Compress-Archive -Path $stage -DestinationPath "Nightwalk-$v-windows.zip"
          Write-Host "Zip contents:"
          (Get-Item "Nightwalk-$v-windows.zip").Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightwalk-windows-${{ inputs.version }}
          path: Nightwalk-${{ inputs.version }}-windows.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Nightwalk v${{ inputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: Nightwalk-${{ inputs.version }}-windows.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
