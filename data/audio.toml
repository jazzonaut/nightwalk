# Audio configuration

[music]
enabled = true
master_volume = 0.05          # 0.0 to 1.0
crossfade_duration = 2.0     # Seconds for track transitions
loop_enabled = true

# Track definitions - add tracks as you generate them
[[music.tracks]]
id = "neon_rooftop_drift_01"
path = "res://assets/audio/music/neon_rooftop_drift_01.mp3"
category = "ambient"
base_volume = 1.0

[[music.tracks]]
id = "neon_rooftop_drift_02"
path = "res://assets/audio/music/neon_rooftop_drift_02.mp3"
category = "ambient"
base_volume = 1.0

[[music.tracks]]
id = "neon_rooftop_drift_03"
path = "res://assets/audio/music/neon_rooftop_drift_03.mp3"
category = "ambient"
base_volume = 1.0

[sfx]
enabled = true
master_volume = 1.0

[sfx.player]
footstep_interval = 0.35     # Seconds between footstep sounds
run_pitch_multiplier = 1.15  # Pitch increase when running

[sfx.environment]
rain_crossfade_duration = 1.5  # Seconds to crossfade between rain intensities
city_ambient_volume = 0.3      # Background city hum volume

